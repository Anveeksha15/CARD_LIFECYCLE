<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-lifecycle-sim checkout</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --border: #2a3350;
    --text: #e6e9f0;
    --muted: #8b95ab;
    --accent: #5b8cff;
    --green: #2fbf71;
    --green-bg: #12291d;
    --red: #ff5a6a;
    --red-bg: #2a1518;
    --amber: #f5b942;
    --amber-bg: #2a2111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number] {
    width: 100%;
    background: #0e1322;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    background: #0e1322;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .checkbox-row label { margin: 0; color: var(--text); font-size: 0.9rem; cursor: pointer; }
  .checkbox-row input { width: auto; }
  button#pay {
    width: 100%;
    margin-top: 18px;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    padding: 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  button#pay:disabled { opacity: 0.6; cursor: default; }
  button#pay:hover:not(:disabled) { filter: brightness(1.08); }
  .result { display: none; }
  .result.show { display: block; }
  .result-title { font-size: 1.1rem; font-weight: 700; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .result-detail { font-size: 0.9rem; color: var(--muted); }
  .result-detail div { margin-top: 3px; }
  .result.success { background: var(--green-bg); border-color: var(--green); }
  .result.success .result-title { color: var(--green); }
  .result.declined { background: var(--red-bg); border-color: var(--red); }
  .result.declined .result-title { color: var(--red); }
  .result.problem { background: var(--amber-bg); border-color: var(--amber); }
  .result.problem .result-title { color: var(--amber); }
  code { background: #0e1322; padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
  .gen-link { font-size: 0.78rem; color: var(--accent); cursor: pointer; margin-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>card-lifecycle-sim</h1>
  <p class="sub">A toy checkout against the gateway running at this origin.</p>

  <div class="card">
    <label>Amount (USD)</label>
    <input type="number" id="amount" value="15.00" step="0.01" min="0.01">

    <label>Card number</label>
    <input type="text" id="card" value="4242424242424242">
    <div class="chips">
      <span class="chip" data-card="4242424242424242">Visa - approve</span>
      <span class="chip" data-card="5555555555554444">Mastercard - approve</span>
      <span class="chip" data-card="378282246310005">Amex - approve</span>
      <span class="chip" data-card="4000000000009995">Visa - insufficient funds</span>
      <span class="chip" data-card="4000000000000002">Visa - blocked</span>
      <span class="chip" data-card="6011000000000004">Discover - unsupported</span>
    </div>

    <div class="row">
      <div>
        <label>Merchant API key</label>
        <input type="text" id="apiKey" value="sk_test_demo_merchant">
      </div>
      <div>
        <label>Idempotency key (optional)<span class="gen-link" id="genKey">generate</span></label>
        <input type="text" id="idemKey" placeholder="leave blank to skip">
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="simulateLost">
      <label for="simulateLost">Simulate lost response (demo the reversal / problem path)</label>
    </div>

    <button id="pay">Pay</button>
  </div>

  <div class="card result" id="result">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-detail" id="resultDetail"></div>
  </div>
</div>

<script>
const DECLINE_MESSAGES = {
  insufficient_funds: "Insufficient funds",
  card_blocked: "Card is blocked",
  card_not_found: "Card not found",
  unsupported_network: "Unsupported card network",
  invalid_merchant: "Invalid merchant API key",
};

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.getElementById("card").value = chip.dataset.card;
  });
});

document.getElementById("genKey").addEventListener("click", () => {
  document.getElementById("idemKey").value = "ui-" + Math.random().toString(16).slice(2, 10);
});

function showResult(kind, title, lines) {
  const box = document.getElementById("result");
  box.className = "card result show " + kind;
  document.getElementById("resultTitle").textContent = title;
  document.getElementById("resultDetail").innerHTML = lines.map(l => `<div>${l}</div>`).join("");
}

document.getElementById("pay").addEventListener("click", async () => {
  const payButton = document.getElementById("pay");
  const amount = parseFloat(document.getElementById("amount").value);
  const card = document.getElementById("card").value.trim();
  const apiKey = document.getElementById("apiKey").value.trim();
  const idemKey = document.getElementById("idemKey").value.trim();
  const simulateLost = document.getElementById("simulateLost").checked;

  if (!amount || amount <= 0 || !card) {
    showResult("problem", "⚠ Problem", ["Enter a valid amount and card number."]);
    return;
  }

  payButton.disabled = true;
  payButton.textContent = "Processing...";

  try {
    const tokenResp = await fetch("/v1/tokens", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ card_number: card }),
    });
    if (!tokenResp.ok) {
      const detail = (await tokenResp.json().catch(() => ({}))).detail || tokenResp.statusText;
      showResult("problem", "⚠ Problem occurred", [`Tokenization failed: ${detail}`]);
      return;
    }
    const { token } = await tokenResp.json();

    const headers = {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${apiKey}`,
    };
    if (idemKey) headers["Idempotency-Key"] = idemKey;
    if (simulateLost) headers["X-Simulate-Lost-Response"] = "true";

    const intentResp = await fetch("/v1/payment_intents", {
      method: "POST",
      headers,
      body: JSON.stringify({ amount_cents: Math.round(amount * 100), token }),
    });

    if (!intentResp.ok) {
      const detail = (await intentResp.json().catch(() => ({}))).detail || intentResp.statusText;
      showResult("problem", "⚠ Problem occurred", [`Gateway returned ${intentResp.status}: ${detail}`]);
      return;
    }

    const intent = await intentResp.json();

    if (intent.status === "succeeded") {
      showResult("success", "✓ Payment successful", [
        `<code>${intent.id}</code>`,
        `Amount: $${(intent.amount_cents / 100).toFixed(2)}`,
      ]);
    } else if (intent.decline_reason === "upstream_timeout") {
      showResult("problem", "⚠ Problem occurred", [
        `<code>${intent.id}</code>`,
        "The response never made it back in time. If the issuer had already " +
        "approved it, the system reversed it automatically.",
      ]);
    } else {
      const msg = DECLINE_MESSAGES[intent.decline_reason] || intent.decline_reason || "Unknown reason";
      showResult("declined", "✕ Payment declined", [
        `<code>${intent.id}</code>`,
        `Reason: ${msg}`,
      ]);
    }
  } catch (err) {
    showResult("problem", "⚠ Problem occurred", [
      "Could not reach the gateway.",
      `<code>${err.message}</code>`,
    ]);
  } finally {
    payButton.disabled = false;
    payButton.textContent = "Pay";
  }
});
</script>
</body>
</html>
