services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gateway:
    build: .
    command: ["python", "-m", "uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ACQUIRER_URL=http://acquirer:8001
      - MERCHANT_WEBHOOK_URL=http://merchant-demo:9000/webhook
    depends_on:
      - redis
      - acquirer
      - merchant-demo

  merchant-demo:
    build: .
    command: ["python", "-m", "uvicorn", "merchant_demo.webhook_receiver:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"
    env_file:
      - .env

  acquirer:
    build: .
    command: ["python", "-m", "uvicorn", "services.acquirer.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PROCESSOR_URL=http://processor:8002
    depends_on:
      - processor

  issuer:
    build: .
    command: ["python", "-m", "uvicorn", "services.issuer.main:app", "--host", "0.0.0.0", "--port", "8004"]
    ports:
      - "8004:8004"
    env_file:
      - .env

  network:
    build: .
    command: ["python", "-m", "uvicorn", "services.network.main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - ISSUER_URL=http://issuer:8004
    depends_on:
      - issuer

  processor:
    build: .
    command: ["python", "-m", "uvicorn", "services.processor.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - NETWORK_URL=http://network:8003
    depends_on:
      - network
